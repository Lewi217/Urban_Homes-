server:
  port: 8081

spring:
  devtools:
    restart:
      enabled: false
  data:
    mongodb:
      uri: ${DB_URI:mongodb://localhost:27017/AoristHomes}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  secret:
    key: ${JWT_SECRET:dummySecret}
  consumer:
    key: ${CONSUMER_KEY:dummyConsumerKey}
    secret: ${CONSUMER_SECRET:dummyConsumerSecret}
  auth:
    url: ${AUTH_URL:https://pay.pesapal.com/v3/api/Auth/RequestToken}
  payment:
    url: ${PAYMENT_URL:https://pay.pesapal.com/v3/api/Transactions/SubmitOrderRequest}
  callback:
    url: ${CALLBACK_URL:https://your-default-callback}
  notification:
    id: ${NOTIFICATION_ID:defaultNotificationId}
  status:
    url: ${STATUS_URL:https://pay.pesapal.com/v3/api/Transactions/GetTransactionStatus}