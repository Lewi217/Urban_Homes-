version: '3.8'

services:
  aorist-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aorist-backend
    ports:
      - "8080:8080"
    volumes:
      - ./src/main/resources/keys.properties:/app/config/keys.properties
    environment:
      - SPRING_CONFIG_IMPORT=optional:file:/app/config/keys.properties
    depends_on:
      - aorist-mongo
    restart: always

  aorist-mongo:
    image: mongo:6.0
    container_name: aorist-mongo
    environment:
      MONGO_INITDB_DATABASE: AoristHomes
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
